<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="title desc">
  <title id="title">Osismi card</title>
  <desc id="desc">Celtae Area card with AP 1.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7d4a"/>
      <stop offset="0.62" stop-color="#244f31"/>
      <stop offset="1" stop-color="#1d1a14"/>
    </linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 15 C8 10 16 20 34 13 M-4 31 C8 24 21 36 38 27" fill="none" stroke="#f3e6c7" stroke-opacity="0.08" stroke-width="2"/>
      <circle cx="9" cy="8" r="1.8" fill="#f3e6c7" fill-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="400" height="580" rx="22" fill="#1d1a14"/>
  <rect x="22" y="22" width="376" height="556" rx="18" fill="url(#field)"/>
  <rect x="22" y="22" width="376" height="556" rx="18" fill="url(#grain)"/>
  <rect x="38" y="38" width="344" height="524" rx="12" fill="none" stroke="#f5ddb0" stroke-opacity="0.8" stroke-width="4"/>
  <rect x="52" y="92" width="316" height="258" rx="14" fill="#efe0bd" fill-opacity="0.18" stroke="#f5ddb0" stroke-opacity="0.38"/>

  <text x="210" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#f9e6b8" letter-spacing="1.6">CELTAE AREA</text>
  <g filter="url(#shadow)">
    <circle cx="332" cy="514" r="48" fill="#15130f" stroke="#f5ddb0" stroke-width="5"/>
    <text x="332" y="531" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#f9e6b8">1</text>
    <text x="332" y="555" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="17" font-weight="700" fill="#f9e6b8">AP</text>
  </g>

  <g transform="translate(92 130)" fill="none" stroke="#b9d58d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M28 164 C62 122 61 71 102 56 C139 43 151 18 184 28 C215 38 227 67 221 103 C215 139 184 151 155 160 C121 170 88 190 28 164 Z"/><path d="M72 148 C90 118 85 91 109 76"/><path d="M138 58 C159 79 175 104 202 105"/><circle cx="119" cy="112" r="12" fill="#b9d58d" stroke="none"/>
  </g>

  <text x="210" y="398" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700" fill="#fff0c8">
    <tspan x="210" y="398">Osismi</tspan>
  </text>
  <text x="210" y="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f5ddb0" opacity="0.96">Matching card for Osismi</text>
  <path d="M67 535 H250" stroke="#f5ddb0" stroke-opacity="0.5" stroke-width="3"/>
  <text x="68" y="558" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#f5ddb0" opacity="0.84">CAESAR'S GALLIC WAR</text>
</svg>
