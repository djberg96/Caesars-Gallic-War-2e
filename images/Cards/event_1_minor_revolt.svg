<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="title desc">
  <title id="title">Minor Revolt card</title>
  <desc id="desc">Minor Revolt event card with 1 optional action point.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b5a3d"/>
      <stop offset="0.62" stop-color="#5e3425"/>
      <stop offset="1" stop-color="#1d1a14"/>
    </linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 15 C8 10 16 20 34 13 M-4 31 C8 24 21 36 38 27" fill="none" stroke="#f3e6c7" stroke-opacity="0.08" stroke-width="2"/>
      <circle cx="9" cy="8" r="1.8" fill="#f3e6c7" fill-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="400" height="580" rx="22" fill="#1d1a14"/>
  <rect x="22" y="22" width="376" height="556" rx="18" fill="url(#field)"/>
  <rect x="22" y="22" width="376" height="556" rx="18" fill="url(#grain)"/>
  <rect x="38" y="38" width="344" height="524" rx="12" fill="none" stroke="#f5ddb0" stroke-opacity="0.82" stroke-width="4"/>

  <text x="210" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#fff0c8">
    <tspan x="210" y="82">Minor Revolt</tspan>
  </text>

  <rect x="58" y="104" width="304" height="405" rx="16" fill="#efe0bd" stroke="#f5ddb0" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="72" y="118" width="276" height="377" rx="10" fill="#f7edd0" fill-opacity="0.94" stroke="#533b20" stroke-opacity="0.24" stroke-width="2"/>
    <text x="76" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="900" fill="#533b20">ROMAN</text>
    <text x="84" y="154" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117">•</text>
    <text x="101" y="154" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">Select 1 active Barbarian-controlled</text>
    <text x="84" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117"></text>
    <text x="101" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">tribe.</text>
    <text x="84" y="190" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117">•</text>
    <text x="101" y="190" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">Its area&#39;s units return home at</text>
    <text x="84" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117"></text>
    <text x="101" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">current strength and remain Barbarian</text>
    <text x="84" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117"></text>
    <text x="101" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">controlled.</text>
    <text x="84" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117">•</text>
    <text x="101" y="242" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">If the home area is empty, they become</text>
    <text x="84" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117"></text>
    <text x="101" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">neutral at full strength.</text>
    <text x="76" y="287" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="900" fill="#533b20">BARBARIAN</text>
    <text x="84" y="309" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117">•</text>
    <text x="101" y="309" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">Select 1 Roman-controlled active tribe</text>
    <text x="84" y="325" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117"></text>
    <text x="101" y="325" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">or neutral tribe.</text>
    <text x="84" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117">•</text>
    <text x="101" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">All units of that tribe&#39;s area return</text>
    <text x="84" y="361" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117"></text>
    <text x="101" y="361" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">home at current strength and become</text>
    <text x="84" y="377" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117"></text>
    <text x="101" y="377" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">Barbarian allies.</text>
    <text x="76" y="406" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="900" fill="#533b20">REVOLT NOTES</text>
    <text x="84" y="428" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117">•</text>
    <text x="101" y="428" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">If the home area is occupied, the</text>
    <text x="84" y="444" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117"></text>
    <text x="101" y="444" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">returning tribe joins the other player</text>
    <text x="84" y="460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117"></text>
    <text x="101" y="460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">and battle is resolved.</text>
    <text x="84" y="480" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650" fill="#2a2117">•</text>
    <text x="101" y="480" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2a2117">Germania may never be targeted.</text>

  <path d="M67 538 H244" stroke="#f5ddb0" stroke-opacity="0.48" stroke-width="3"/>
  <text x="68" y="555" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f5ddb0" opacity="0.82">CAESAR'S GALLIC WAR</text>
  <circle cx="306" cy="550" r="14" fill="#15130f" stroke="#f5ddb0" stroke-width="2"/>
  <text x="306" y="558" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#f9e6b8">1</text>
  <text x="346" y="555" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" fill="#f5ddb0" opacity="0.88">15</text>
</svg>
