<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="title desc">
  <title id="title">Minor Revolt card</title>
  <desc id="desc">Event card with 1 action point.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b3f3b"/>
      <stop offset="0.62" stop-color="#522725"/>
      <stop offset="1" stop-color="#1d1a14"/>
    </linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 15 C8 10 16 20 34 13 M-4 31 C8 24 21 36 38 27" fill="none" stroke="#f3e6c7" stroke-opacity="0.08" stroke-width="2"/>
      <circle cx="9" cy="8" r="1.8" fill="#f3e6c7" fill-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="400" height="580" rx="22" fill="#1d1a14"/>
  <rect x="22" y="22" width="376" height="556" rx="18" fill="url(#field)"/>
  <rect x="22" y="22" width="376" height="556" rx="18" fill="url(#grain)"/>
  <rect x="38" y="38" width="344" height="524" rx="12" fill="none" stroke="#f5ddb0" stroke-opacity="0.82" stroke-width="4"/>

  <text x="210" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#fff0c8">
    <tspan x="210" y="82">Minor Revolt</tspan>
  </text>
  <g transform="translate(72 107)" stroke="#e59a86" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M65 212 C102 172 107 123 148 102 C181 85 209 63 236 31"/>
  <path d="M229 31 L271 22 L256 64"/>
  <path d="M56 210 C45 168 50 125 73 88 C94 56 127 37 170 34"/>
  <path d="M91 227 C139 224 190 201 230 162"/>
  <path d="M112 118 L70 76 M154 93 L126 48 M190 70 L180 29"/>
</g>


  <text x="210" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800" fill="#f9e6b8" letter-spacing="1.6">Event</text>

  <g filter="url(#shadow)">
    <circle cx="210" cy="468" r="46" fill="#15130f" stroke="#f5ddb0" stroke-width="5"/>
    <text x="210" y="491" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#f9e6b8">1</text>
  </g>

  <path d="M67 538 H244" stroke="#f5ddb0" stroke-opacity="0.48" stroke-width="3"/>
  <text x="68" y="555" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f5ddb0" opacity="0.82">CAESAR'S GALLIC WAR</text>
  <text x="346" y="555" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800" fill="#f5ddb0" opacity="0.88">15</text>
