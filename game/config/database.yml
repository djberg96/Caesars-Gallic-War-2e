default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: storage/production.sqlite3

# Desktop packages are installed in a read-only application directory. The
# launcher points this at the current user's application-data directory.
desktop:
  <<: *default
  database: <%= ENV.fetch("CGW_DATABASE_PATH", Rails.root.join("storage/desktop.sqlite3")) %>
